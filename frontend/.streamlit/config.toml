[server]
headless = true

[browser]
gatherUsageStats = false

[client]
# End-user toolbar: no Deploy button and no developer menu items (Rerun, Auto rerun, Clear cache),
# even on localhost. The rest of the ⋮ menu is hidden in style.py and replaced by the header theme
# selector (components/theme.py), which still uses the menu's theme items.
toolbarMode = "viewer"

# TubeTalk red × black × white, with neutral greys. Red marks the brand, primary actions and the
# selected item; everything else is black, white and grey (see components/style.py). The button red
# (#E0002B) keeps white text readable (about 5:1); the logo uses the brighter brand red #FF0033.
# Streamlit offers the light/dark switch in its own Settings menu, so both variants are defined here.
[theme.dark]
primaryColor = "#E0002B"
backgroundColor = "#0F0F0F"
secondaryBackgroundColor = "#1C1C1C"
textColor = "#F1F1F1"
borderColor = "#2E2E2E"
linkColor = "#FF5470"
font = "sans serif"
headingFont = "sans serif"
baseRadius = "10px"

[theme.light]
primaryColor = "#E0002B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F2F2"
textColor = "#0F0F0F"
borderColor = "#E2E2E2"
linkColor = "#C20025"
font = "sans serif"
headingFont = "sans serif"
baseRadius = "10px"
